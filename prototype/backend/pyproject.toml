[project]
name = "orphan-repurpose-backend"
version = "0.1.0"
description = "OrphanRepurpose API backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "kuzu>=0.7.0",
    "chromadb>=0.5.0",
    "networkx>=3.3",
    "rdkit>=2024.3.0",
    "torch>=2.4.0",
    "torch-geometric>=2.6.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "shap>=0.45.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.api.v1", "app.core", "app.models", "app.services"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "N"]
lint.ignore = ["S101", "T201"]
format.quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: tests requiring a real Kuzu DB or model artifacts",
]
addopts = "-v --tb=short"